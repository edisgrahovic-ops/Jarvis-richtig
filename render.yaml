# render.yaml – Blueprint fuer kostenloses Hosting auf https://render.com
# Damit bekommt ihr eine oeffentliche Jarvis-Adresse (Link), die ihr teilen koennt.
#
# So gehts (siehe README.md, Abschnitt "Jarvis online stellen"):
#   1. Auf render.com mit GitHub anmelden
#   2. New -> Blueprint -> dieses Repo waehlen
#   3. Beim Feld GROQ_API_KEY euren gratis Groq-Schluessel eintragen
#      (Schluessel gibts unter https://console.groq.com/keys)
#   4. Deploy -> nach ~1-2 Min bekommt ihr eine URL wie https://jarvis-xyz.onrender.com
services:
  - type: web
    name: jarvis-dropshipping
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Schluessel gebt ihr sicher im Render-Dashboard ein
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
